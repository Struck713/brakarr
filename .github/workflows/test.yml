name: Test

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install libmediainfo
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmediainfo-dev

      - name: Generate templates
        run: go run github.com/a-h/templ/cmd/templ@v0.3.1100 generate

      - name: Run tests
        run: go test ./...
